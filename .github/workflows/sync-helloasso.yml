name: Sync HelloAsso members

on:
  workflow_dispatch: {}
  schedule:
    - cron: '13 12 * * *'
      timezone: 'Europe/Paris'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync HelloAsso memberships into Firebase v2
        env:
          HELLOASSO_CLIENT_ID:     ${{ secrets.HELLOASSO_CLIENT_ID }}
          HELLOASSO_CLIENT_SECRET: ${{ secrets.HELLOASSO_CLIENT_SECRET }}
          HELLOASSO_ORG_SLUG:      ${{ secrets.HELLOASSO_ORG_SLUG }}
          FIREBASE_DB_URL:         ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_DB_SECRET:      ${{ secrets.FIREBASE_DB_SECRET }}
          BREVO_API_KEY:               ${{ secrets.BREVO_API_KEY }}
          BREVO_WELCOME_TEMPLATE_ID:   ${{ secrets.BREVO_WELCOME_TEMPLATE_ID }}
        run: node scripts/sync-helloasso.js
