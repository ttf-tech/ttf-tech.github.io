  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 55%, #0f172a 100%); min-height: 100vh; }
    .game-wrap { max-width: 480px; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; min-height: 100vh; display: flex; flex-direction: column; }

    .g-header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0 1.25rem; }
    .g-logo { display: flex; align-items: center; gap: 0.5rem; color: #fff; font-weight: 800; font-size: 0.95rem; text-decoration: none; }
    .g-logo img { width: 28px; height: 28px; border-radius: 8px; }
    .lang-toggle {
      display: flex; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 99px; padding: 0.2rem; gap: 0.15rem;
    }
    .lang-toggle button {
      border: none; background: transparent; color: rgba(255,255,255,0.55); font-size: 0.72rem; font-weight: 700;
      padding: 0.35rem 0.65rem; border-radius: 99px; cursor: pointer; min-height: 32px;
    }
    .lang-toggle button.active { background: #fff; color: #1e1b4b; }

    .g-nav { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; min-height: 32px; }
    .g-back {
      color: rgba(255,255,255,0.6); background: none; border: none; font-size: 1.1rem; cursor: pointer;
      min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center;
    }
    .g-dots { display: flex; gap: 0.4rem; }
    .g-dot { width: 8px; height: 8px; border-radius: 99px; background: rgba(255,255,255,0.2); transition: background 0.2s, transform 0.2s; }
    .g-dot.done { background: #22d3ee; }
    .g-dot.current { background: #fff; transform: scale(1.3); }

    .g-view { display: none; flex: 1; flex-direction: column; }
    .g-view.active { display: flex; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .g-title { color: #fff; font-size: 1.5rem; font-weight: 900; line-height: 1.3; margin-bottom: 0.5rem; }
    .g-sub { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 1.75rem; line-height: 1.5; }

    .g-opt {
      display: block; width: 100%; text-align: left; background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12); color: #fff; border-radius: 14px;
      padding: 0.95rem 1.1rem; margin-bottom: 0.65rem; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; min-height: 48px; transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .g-opt:active { transform: scale(0.98); }
    .g-opt:hover { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.3); }
    .g-opt-zh { display: block; }
    .g-opt-fr { display: block; font-size: 0.76rem; font-weight: 400; color: rgba(255,255,255,0.55); margin-top: 0.15rem; }

    .g-cta {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      background: linear-gradient(135deg, #22d3ee, #6366f1); color: #0f172a; font-weight: 800;
      border: none; border-radius: 14px; padding: 1rem 1.5rem; font-size: 1rem; cursor: pointer;
      min-height: 52px; width: 100%; text-decoration: none; box-shadow: 0 8px 24px rgba(99,102,241,0.35);
    }
    .g-cta-secondary {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      background: rgba(255,255,255,0.08); color: #fff; font-weight: 700;
      border: 1.5px solid rgba(255,255,255,0.2); border-radius: 14px; padding: 0.9rem 1.5rem;
      font-size: 0.9rem; cursor: pointer; min-height: 48px; width: 100%; text-decoration: none;
    }

    .archetype-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.03) 100%);
      border: 1.5px solid var(--accent-border, rgba(34,211,238,0.3));
      box-shadow: 0 12px 32px rgba(15,23,42,0.6), inset 0 1px 0 rgba(255,255,255,0.15);
      border-radius: 24px; padding: 2rem 1.5rem; text-align: center; margin-bottom: 1.25rem;
      position: relative; overflow: hidden; transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .archetype-card::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent-bar-1, #22d3ee), var(--accent-bar-2, #6366f1));
    }
    .archetype-emoji { font-size: 2.75rem; margin-bottom: 0.5rem; }
    .archetype-name-zh { color: #fff; font-size: 1.6rem; font-weight: 900; }
    .archetype-name-fr { color: var(--accent-bar-1, #22d3ee); font-size: 1rem; font-weight: 700; margin-top: 0.15rem; }
    .archetype-tagline { color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-top: 0.75rem; line-height: 1.5; }

    .stat-line {
      background: rgba(34,211,238,0.1); border: 1px solid rgba(34,211,238,0.25);
      border-radius: 12px; padding: 0.85rem 1rem; font-size: 0.78rem; color: #a5f3fc;
      line-height: 1.5; margin-bottom: 1.25rem;
    }

    .unlock-section { margin-top: 1.75rem; }
    .unlock-label {
      color: rgba(255,255,255,0.4); font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.4rem;
    }
    .lock-card {
      position: relative; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 1.1rem 1.25rem; margin-bottom: 0.75rem; overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .lock-card.primary {
      border-color: rgba(34,211,238,0.4); background: rgba(34,211,238,0.05);
      box-shadow: 0 4px 16px rgba(34,211,238,0.08);
    }
    .lock-card-eyebrow {
      color: rgba(255,255,255,0.45); font-size: 0.64rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 0.3rem;
    }
    .lock-card-title { color: #fff; font-weight: 700; font-size: 0.88rem; }
    .lock-card-title-fr { color: rgba(255,255,255,0.55); font-size: 0.74rem; margin-top: 0.15rem; }
    .lock-icon { position: absolute; top: 0.9rem; right: 1rem; color: rgba(255,255,255,0.35); font-size: 0.85rem; }
    /* Teaser + blur: the category label above stays sharp (Zeigarnik hook),
       only the specific payoff text is blurred — a preview, not a wall. */
    .lock-blur-preview {
      display: inline-block; margin-top: 0.4rem; padding: 0.1rem 0.5rem;
      color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); border-radius: 6px;
      filter: blur(3px); user-select: none; font-size: 0.78rem;
    }

    .adv-topics-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.65rem; }
    .adv-topic-chip {
      display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.3rem 0.6rem;
      background: rgba(34,211,238,0.08); border: 1px solid rgba(34,211,238,0.2);
      border-radius: 99px; font-size: 0.68rem; font-weight: 600; color: rgba(255,255,255,0.75);
    }
    .adv-topic-chip i { font-size: 0.6rem; color: rgba(34,211,238,0.75); }

    /* Archetype art card — blurred sneak-peek pre-membership, full reveal after. */
    .archetype-art-wrap { text-align: center; margin-top: 0.75rem; }
    .archetype-art-blur {
      width: 100%; max-width: 220px; border-radius: 14px; display: block; margin: 0 auto;
      filter: blur(7px) brightness(0.6); user-select: none; pointer-events: none;
    }
    .archetype-art-caption {
      margin-top: 0.5rem; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em;
      color: rgba(255,255,255,0.5); text-align: center;
    }
    .archetype-art-full {
      width: 100%; max-width: 260px; border-radius: 16px; display: block; margin: 0.75rem auto 0;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }

    /* Strategic Diagnostic Report — the member-only advanced-insights reveal.
       Validation (rapport) → per-theme Dynamic/Analysis/Action, not a flat list. */
    .diag-validation {
      background: rgba(255,255,255,0.05); border-left: 3px solid var(--accent-bar-1, #22d3ee);
      border-radius: 10px; padding: 0.9rem 1rem; margin: 0.75rem 0 1.1rem;
      font-size: 0.8rem; color: rgba(255,255,255,0.75); line-height: 1.65;
    }
    .diag-validation i { color: var(--accent-bar-1, #22d3ee); margin-right: 0.4rem; }
    .diag-theme { margin-bottom: 1.1rem; }
    .diag-theme:last-child { margin-bottom: 0; }
    .diag-theme-title {
      display: flex; align-items: center; gap: 0.4rem; font-size: 0.72rem; font-weight: 800;
      color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 0.6rem; padding-bottom: 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .diag-theme-title i { color: var(--accent-bar-1, #22d3ee); }
    .diag-item { margin-bottom: 0.9rem; }
    .diag-item:last-child { margin-bottom: 0; }
    .diag-dynamic { font-size: 0.8rem; font-weight: 700; color: #fff; margin-bottom: 0.25rem; }
    .diag-analysis { font-size: 0.74rem; color: rgba(255,255,255,0.55); line-height: 1.6; margin-bottom: 0.45rem; }
    .diag-action {
      display: flex; align-items: flex-start; gap: 0.45rem; font-size: 0.76rem; line-height: 1.55;
      color: var(--accent-bar-1, #22d3ee); background: rgba(255,255,255,0.04); border-radius: 8px; padding: 0.55rem 0.7rem;
    }
    .diag-action i { margin-top: 0.2rem; flex-shrink: 0; font-size: 0.7rem; }
    /* Icon-driven chunking: each item's own topic icon sits left of its headline. */
    .diag-dynamic { display: flex; align-items: flex-start; gap: 0.45rem; }
    .diag-dynamic i { margin-top: 0.15rem; flex-shrink: 0; font-size: 0.72rem; color: var(--accent-bar-1, #22d3ee); }

    .share-row { display: flex; gap: 0.6rem; margin-bottom: 0.85rem; }
    .share-row .g-cta { background: #25d366; color: #fff; box-shadow: 0 8px 24px rgba(37,211,102,0.3); }

    /* Peak-end capsule + multi-platform share dock, shown after the full result. */
    .anchor-capsule {
      margin-top: 1.5rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 1.1rem; text-align: center;
    }
    .anchor-capsule-text { font-size: 0.78rem; color: rgba(255,255,255,0.8); line-height: 1.6; margin-bottom: 1rem; }
    .anchor-capsule-label {
      font-size: 0.68rem; font-weight: 800; color: rgba(255,255,255,0.4); text-transform: uppercase;
      letter-spacing: 0.07em; margin-bottom: 0.7rem;
    }
    .share-dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .share-dock a {
      display: flex; align-items: center; justify-content: center; min-height: 42px;
      border-radius: 10px; color: #fff; font-size: 1rem; transition: transform 0.1s, opacity 0.15s;
    }
    .share-dock a:hover { opacity: 0.88; transform: translateY(-1px); }
    .share-dock a.share-line { background: #06c755; }
    .share-dock a.share-linkedin { background: #0a66c2; }
    .share-dock a.share-whatsapp { background: #25d366; }
    .share-dock a.share-facebook { background: #1877f2; }

    /* Full-family showcase — teases the other 4 archetypes right after the result,
       before the member-gated section, to pull people into "what else could I be?" */
    .result-family-wrap { text-align: center; margin-bottom: 1.5rem; }
    .result-family-img {
      width: 100%; border-radius: 16px; display: block;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
    }
    .result-family-caption {
      margin-top: 0.6rem; font-size: 0.76rem; color: rgba(255,255,255,0.55); line-height: 1.5;
    }

    .g-footer-link { text-align: center; color: rgba(255,255,255,0.35); font-size: 0.75rem; margin-top: 1.5rem; }
    .g-footer-link a { color: rgba(255,255,255,0.5); text-decoration: underline; }
  </style>

<body>

  <div class="game-wrap">
    <div class="g-header">
      <a class="g-logo" href="index.html">
        <img src="favicon-32x32.png" alt="TTF">
        <span>Taiwan Tech France</span>
      </a>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="fr">FR</button>
      </div>
    </div>

    <div class="g-nav">
      <button type="button" class="g-back" id="back-btn" style="visibility:hidden;"><i class="fas fa-arrow-left"></i></button>
      <div class="g-dots" id="dots" style="display:none;">
        <div class="g-dot" data-dot="0"></div>
        <div class="g-dot" data-dot="1"></div>
        <div class="g-dot" data-dot="2"></div>
      </div>
    </div>

    <!-- Splash -->
    <div class="g-view active" id="view-splash">
      <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
        <div style="font-size:3rem; margin-bottom:1rem;">🧭</div>
        <div class="g-title" data-zh="你的台法職涯原型是？" data-fr="Quel est ton archétype carrière France-Taïwan ?">你的台法職涯原型是？</div>
        <div class="g-sub" data-zh="3 個問題，1 分鐘，找出最適合你的方向與資源。" data-fr="3 questions, 1 minute, pour trouver la direction et les ressources qui te correspondent.">3 個問題，1 分鐘，找出最適合你的方向與資源。</div>
      </div>
      <button type="button" class="g-cta" id="start-btn">
        <span data-zh="開始測驗" data-fr="Commencer">開始測驗</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>

    <!-- Q1 : status -->
    <div class="g-view" id="view-q1">
      <div class="g-title" data-zh="你目前的狀態是？" data-fr="Quel est ton statut actuel ?">你目前的狀態是？</div>
      <div class="g-sub" data-zh="幫我們更了解你" data-fr="Pour mieux te connaître">幫我們更了解你</div>
      <div id="q1-options"></div>
    </div>

    <!-- Q2 : trajectory -->
    <div class="g-view" id="view-q2">
      <div class="g-title" data-zh="台法兩地的長期規劃？" data-fr="Ta trajectoire long terme, France-Taïwan ?">台法兩地的長期規劃？</div>
      <div class="g-sub" data-zh="這決定你的原型" data-fr="Ceci détermine ton archétype">這決定你的原型</div>
      <div id="q2-options"></div>
    </div>

    <!-- Q3 : immediate need -->
    <div class="g-view" id="view-q3">
      <div class="g-title" data-zh="現在最需要的資源？" data-fr="De quoi as-tu besoin en ce moment ?">現在最需要的資源？</div>
      <div class="g-sub" data-zh="最後一題！" data-fr="Dernière question !">最後一題！</div>
      <div id="q3-options"></div>
    </div>

    <!-- Result -->
    <div class="g-view" id="view-result">
      <div class="archetype-card" id="archetype-card">
        <div class="archetype-emoji" id="r-emoji">🧭</div>
        <div class="archetype-name-zh" id="r-name-zh">扎根者</div>
        <div class="archetype-name-fr" id="r-name-fr">L'Ancreur</div>
        <div class="archetype-tagline" id="r-tagline"></div>
      </div>

      <div class="stat-line" id="r-stat"></div>

      <div class="share-row">
        <a class="g-cta" id="share-btn" target="_blank" rel="noopener">
          <i class="fab fa-whatsapp"></i>
          <span data-zh="分享給朋友" data-fr="Partager">分享給朋友</span>
        </a>
      </div>

      <div class="result-family-wrap">
        <img class="result-family-img" src="assets/img/game-result.jpeg" alt="5 archétypes carrière France-Taïwan · 5 種台法職涯原型" loading="lazy">
        <div class="result-family-caption" data-zh="還有 4 種原型等你發掘，邀請朋友一起測試！" data-fr="4 autres archétypes à découvrir — invite tes amis à tester !">還有 4 種原型等你發掘，邀請朋友一起測試！</div>
      </div>

      <div class="unlock-section">
        <div class="unlock-label"><i class="fas fa-lock"></i><span data-zh="專屬解鎖內容" data-fr="Contenu à débloquer">專屬解鎖內容</span></div>

        <div class="lock-card primary">
          <i class="fas fa-lock lock-icon"></i>
          <div class="lock-card-eyebrow" data-zh="根據你的原型，你的專屬行動指南" data-fr="Selon ton archétype, ton guide d'action personnalisé">根據你的原型，你的專屬行動指南</div>
          <div class="lock-card-title lock-blur-preview" id="r-hook-zh">你的專屬行動指南</div>
        </div>

        <div id="r-needs-list"></div>

        <div class="lock-card" id="advanced-gate-card" style="margin-top:0.9rem;background:rgba(255,255,255,0.03);">
          <div class="lock-card-title" style="color:rgba(255,255,255,0.75);" data-zh="進階版測驗（7 題，更精準結果）" data-fr="Test avancé (7 questions, résultat plus précis)">進階版測驗（7 題，更精準結果）</div>
          <div class="lock-card-title-fr" data-zh="僅限 Adhésion 會員解鎖" data-fr="Réservé aux membres Adhésion">僅限 Adhésion 會員解鎖</div>

          <div class="archetype-art-wrap" id="archetype-art-locked">
            <img class="archetype-art-blur" id="archetype-art-img-blur" src="" alt="" loading="lazy">
            <div class="archetype-art-caption" data-zh="✦ 解鎖你的專屬原型視覺卡 ✦" data-fr="✦ Débloque ta carte d'archétype exclusive ✦">✦ 解鎖你的專屬原型視覺卡 ✦</div>
          </div>
          <img class="archetype-art-full" id="archetype-art-img-full" src="" alt="" style="display:none;" loading="lazy">

              <i class="fab fa-google"></i>
              <span data-zh="登入驗證" data-fr="Se connecter">登入驗證</span>
            </button>
            <a href="adhesion.html" class="g-cta-secondary adv-join-btn" style="display:none;min-height:40px;padding:0.55rem 1rem;font-size:0.78rem;width:auto;flex:1;">
              <i class="fas fa-id-card"></i>
              <span data-zh="加入會員" data-fr="Adhérer">加入會員</span>
            </a>
            <button type="button" class="g-cta-secondary adv-start-btn" style="display:none;min-height:40px;padding:0.55rem 1rem;font-size:0.78rem;width:auto;flex:1;">
              <i class="fas fa-unlock"></i>
              <span data-zh="開始進階測驗" data-fr="Commencer le test avancé">開始進階測驗</span>
            </button>
          </div>
        </div>

        <div id="advanced-questions" style="display:none;margin-top:0.65rem;"></div>

    },
    {

      dynamic_zh: '資訊不對稱下的談判弱勢', dynamic_fr: 'Position de négociation affaiblie par l\'asymétrie d\'information',

      analysis_fr: 'Les règles de rémunération et d\'équité varient d\'une entreprise à l\'autre ; celui qui ne les comprend pas cède souvent le premier à la table des négociations — maîtriser l\'information est déjà un levier.',
      title_zh: '進階問題 5／7：面對法國企業的薪資與股權方案，你最不確定的是？',
      title_fr: 'Question avancée 5/7 : dans les packages salariaux et actions des entreprises françaises, qu\'est-ce qui reste flou ?',
      options: [
        { id: 'bspce_tax', zh: 'BSPCE／股票選擇權的稅務規則', fr: 'Fiscalité des BSPCE / stock-options',
          insight_zh: '建議優先了解 BSPCE 行使與出售時點的稅務差異。', insight_fr: 'Priorité : comprendre la différence de fiscalité entre exercice et cession des BSPCE.' },
        { id: 'benefits', zh: '13ème mois、intéressement 等福利換算', fr: 'Calcul des avantages : 13e mois, intéressement',
          insight_zh: '建議將這些福利折算進年薪，才能正確比較不同 offer。', insight_fr: 'Priorité : intégrer ces avantages au salaire annuel pour bien comparer les offres.' },
        { id: 'negotiation', zh: '如何在面試中談判薪資區間', fr: 'Négocier la fourchette salariale en entretien',
          insight_zh: '我們會優先為你媒合近期成功談判薪資的會員分享實戰經驗。', insight_fr: 'On te mettra en priorité en contact avec des membres ayant récemment négocié leur salaire.' },
        { id: 'scaleup_vs_corp', zh: 'Scale-up vs 大企業的薪資結構差異', fr: 'Différences de structure salariale scale-up vs grand groupe',
          insight_zh: '建議比較現金／股權比例，再依你的風險承受度做選擇。', insight_fr: 'Priorité : comparer le ratio cash/equity selon ta tolérance au risque.' }
      ]
    },
    {
      theme: 'lifestyle',
      topic_zh: '成家與教育', topic_fr: 'Famille & école', topic_icon: 'fa-people-roof',
      dynamic_zh: '個人選擇牽動整個家庭系統', dynamic_fr: 'Un choix individuel qui engage tout le système familial',
      analysis_zh: '成家決定不再只是你一個人的規劃，教育、托育與簽證環環相扣；提早理解全貌，能避免日後被迫倉促決定。',
      analysis_fr: 'Fonder une famille n\'est plus une décision individuelle : éducation, garde d\'enfants et visa sont interdépendants ; comprendre l\'ensemble tôt évite des décisions précipitées plus tard.',
      title_zh: '進階問題 6／7：如果你考慮在法國成家，最想先了解什麼？',
      title_fr: 'Question avancée 6/7 : si tu envisages de fonder une famille en France, que veux-tu comprendre en premier ?',
      options: [
        { id: 'bilingual_school', zh: '雙語教育與國際學校選擇', fr: 'Éducation bilingue et choix d\'école internationale',
          insight_zh: '我們會優先為你媒合已為孩子選校的會員分享實際經驗。', insight_fr: 'On te mettra en priorité en contact avec des membres ayant déjà choisi une école pour leurs enfants.' },
        { id: 'childcare_caf', zh: '托育資源與家庭津貼（CAF）', fr: 'Garde d\'enfants et allocations familiales CAF',
          insight_zh: '建議提早申請 CAF 並了解 crèche 與 assistante maternelle 的差異。', insight_fr: 'Priorité : faire la demande CAF tôt et comparer crèche vs assistante maternelle.' },
        { id: 'family_reunion', zh: '家庭團聚簽證流程', fr: 'Procédure de regroupement familial',
          insight_zh: '建議提前準備家庭團聚簽證所需文件，流程通常需數月。', insight_fr: 'Priorité : préparer le dossier de regroupement familial en amont, la procédure prend plusieurs mois.' },
        { id: 'intercultural', zh: '跨文化婚姻與家庭適應', fr: 'Mariage interculturel et adaptation familiale',
          insight_zh: '我們會優先為你媒合跨文化家庭的會員交流適應經驗。', insight_fr: 'On te mettra en priorité en contact avec des membres en couple/famille interculturelle.' }
      ]
    },
    {
      theme: 'structural',
      topic_zh: '長期理財規劃', topic_fr: 'Patrimoine long terme', topic_icon: 'fa-chart-line',
      dynamic_zh: '短期便利 vs. 長期複利的取捨', dynamic_fr: 'Arbitrage entre confort à court terme et intérêts composés à long terme',
      analysis_zh: '跨境理財規劃的價值往往要 10 年後才顯現，正因為看不到立即回報，才最容易被一再拖延。',
      analysis_fr: 'La valeur d\'une planification patrimoniale transfrontalière se révèle souvent après 10 ans ; c\'est justement parce que le retour n\'est pas immédiat qu\'elle est facilement repoussée.',
      title_zh: '進階問題 7／7：台法兩地長期理財規劃，你最想深入了解哪一項？',
      title_fr: 'Question avancée 7/7 : pour ta stratégie patrimoniale long terme France-Taïwan, que veux-tu approfondir ?',
      options: [
        { id: 'french_tools', zh: 'PEA／assurance-vie 等法國投資工具', fr: 'Outils d\'investissement français : PEA, assurance-vie',
          insight_zh: '建議優先了解 PEA 與 assurance-vie 的持有年限與稅務優勢。', insight_fr: 'Priorité : comprendre les durées de détention et avantages fiscaux du PEA et de l\'assurance-vie.' },
        { id: 'tw_declaration', zh: '台灣資產於海外的申報義務', fr: 'Obligations déclaratives pour des actifs taïwanais à l\'étranger',
          insight_zh: '建議與熟悉台法雙邊申報規定的前輩確認你的申報義務。', insight_fr: 'Priorité : vérifier tes obligations déclaratives avec des pairs connaissant les deux régimes.' },
        { id: 'retirement_tax', zh: '退休後的居住地稅務規劃', fr: 'Planification fiscale du lieu de résidence à la retraite',
          insight_zh: '建議提前規劃退休時的稅務居住地，影響長期實拿金額。', insight_fr: 'Priorité : anticiper ta résidence fiscale à la retraite, cela impacte le montant net perçu.' },
        { id: 'inheritance', zh: '遺產規劃與跨境繼承', fr: 'Planification successorale et héritage transfrontalier',
          insight_zh: '建議及早了解台法之間跨境繼承的稅務與法律差異。', insight_fr: 'Priorité : te renseigner tôt sur les différences fiscales et légales de l\'héritage transfrontalier.' }
      ]
    }
  ];

  // Tone modulation by Q1 answer — "en recherche" leads with referrals, per spec.
  const TONE = {
    cdi:       { zh: '穩定的起點，是時候放眼下一步了。', fr: 'Un point de départ stable — il est temps de viser plus loin.' },
    freelance: { zh: '自由工作者的彈性，正是連結資源的好時機。', fr: 'La flexibilité du freelance, le bon moment pour se connecter aux bonnes ressources.' },
    recherche: { zh: '求職中？現在正是善用社群內推網絡的時刻。', fr: 'En recherche ? C\'est le moment d\'activer le réseau de cooptation de la communauté.' },
    nouveau:   { zh: '剛抵達法國？從這些資源開始，少走彎路。', fr: 'Nouvel(le) arrivant(e) ? Commence par ces ressources pour gagner du temps.' }
  };

  // ── State ──────────────────────────────────────────────────────
  const STEPS = ['splash', 'q1', 'q2', 'q3', 'result'];
  let state = { step: 0, lang: 'zh', q1: null, q2: null, q3: null, advancedInsights: [] };
  let advancedStarted = false;
  let hasAssoAccess = false;

  function detectLang() {
    try {
      const saved = localStorage.getItem('ttf_game_lang');
      if (saved === 'zh' || saved === 'fr') return saved;
    } catch (_) {}
    const nav = (navigator.language || '').toLowerCase();
    return nav.startsWith('fr') ? 'fr' : 'zh';
  }

  function setLang(lang) {
    state.lang = lang;
    try { localStorage.setItem('ttf_game_lang', lang); } catch (_) {}
    document.querySelectorAll('[data-lang]').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
    document.querySelectorAll('[data-zh]').forEach(el => {
      el.textContent = lang === 'fr' ? `${el.dataset.fr} · ${el.dataset.zh}` : `${el.dataset.zh} · ${el.dataset.fr}`;
    });
    renderOptions();
    renderAdvancedTopics();
    if (STEPS[state.step] === 'result') renderResult();
    if (advancedStarted) renderAdvancedFlow();
  }

  // The Mastermind Matrix: topic labels stay visible pre-signin so visitors can
  // see the depth of what's gated (tax treaties, real estate, schooling...) —
  // only the actual question/answer interaction below is behind the member gate.
  function renderAdvancedTopics() {
    const grid = document.getElementById('advanced-topics-preview');
    if (!grid) return;
    grid.innerHTML = ADVANCED_QUESTIONS.map(q =>
      `<span class="adv-topic-chip"><i class="fas ${q.topic_icon}"></i>${both(q.topic_zh, q.topic_fr)}</span>`
    ).join('');
  }

  function showStep(index) {
    state.step = index;
    const name = STEPS[index];
    document.querySelectorAll('.g-view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');

    const backBtn = document.getElementById('back-btn');
    backBtn.style.visibility = (name === 'splash' || name === 'result') ? 'hidden' : 'visible';

    const dots = document.getElementById('dots');
    const questionSteps = ['q1', 'q2', 'q3'];
    if (questionSteps.includes(name)) {
      dots.style.display = 'flex';
      const qIndex = questionSteps.indexOf(name);
      document.querySelectorAll('.g-dot').forEach((dot, i) => {
        dot.classList.toggle('done', i < qIndex);
        dot.classList.toggle('current', i === qIndex);
      });
    } else {
      dots.style.display = 'none';
    }
  }

  function goBack() {
    const name = STEPS[state.step];
    if (name === 'q1') showStep(STEPS.indexOf('splash'));
    else if (name === 'q2') showStep(STEPS.indexOf('q1'));
    else if (name === 'q3') showStep(STEPS.indexOf('q2'));
  }

  function optionButton(opt, onPick) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'g-opt';
    btn.innerHTML = `<span class="g-opt-zh">${state.lang === 'fr' ? opt.fr : opt.zh}</span>` +
                    (opt.zh && opt.fr ? `<span class="g-opt-fr">${state.lang === 'fr' ? opt.zh : opt.fr}</span>` : '');
    btn.addEventListener('click', onPick);
    return btn;
  }

  function renderOptions() {
    const q1Wrap = document.getElementById('q1-options');
    q1Wrap.innerHTML = '';
    Q1_OPTIONS.forEach(opt => {
      q1Wrap.appendChild(optionButton(opt, () => {
        state.q1 = opt.id;
        showStep(STEPS.indexOf('q2'));
      }));
    });

    const q2Wrap = document.getElementById('q2-options');
    q2Wrap.innerHTML = '';
    Q2_OPTIONS.forEach(opt => {
      q2Wrap.appendChild(optionButton(opt, () => {
        state.q2 = opt.id;
        showStep(STEPS.indexOf('q3'));
      }));
    });

    const q3Wrap = document.getElementById('q3-options');
    q3Wrap.innerHTML = '';
    Q3_OPTIONS.forEach(opt => {
      q3Wrap.appendChild(optionButton(opt, () => {
        state.q3 = opt.id;
        renderResult();
        showStep(STEPS.indexOf('result'));
      }));
    });
  }

  // Always renders both languages together — order only follows the toggle.
  function both(zh, fr) {
    return state.lang === 'fr' ? `${fr} · ${zh}` : `${zh} · ${fr}`;
  }

  function renderResult() {
    const archetype = ARCHETYPES[state.q2] || ARCHETYPES.ancreur;
    const lang = state.lang;

    document.getElementById('r-emoji').textContent = archetype.emoji;
    document.getElementById('r-name-zh').textContent = lang === 'fr' ? archetype.fr : archetype.zh;
    document.getElementById('r-name-fr').textContent = lang === 'fr' ? archetype.zh : archetype.fr;
    document.getElementById('r-tagline').textContent = both(archetype.tagline_zh, archetype.tagline_fr);
    document.getElementById('r-hook-zh').textContent = both(archetype.hook_zh, archetype.hook_fr);

    // Identity Mirror: each archetype gets its own border glow + gradient bar.
    // Set on the whole result view (not just the hero card) so the diagnostic
    // report below — a DOM sibling of the hero card — can inherit the same accent.
    const resultView = document.getElementById('view-result');
    if (resultView && archetype.accent) {
      resultView.style.setProperty('--accent-border', archetype.accent.border);
      resultView.style.setProperty('--accent-bar-1', archetype.accent.bar1);
      resultView.style.setProperty('--accent-bar-2', archetype.accent.bar2);
    }

    // Member-exclusive archetype art (assets/img/<archetype zh name>.jpeg).
    const artSrc = `assets/img/${encodeURIComponent(archetype.zh)}.jpeg`;
    const artAlt = `${archetype.zh} · ${archetype.fr}`;
    ['archetype-art-img-blur', 'archetype-art-img-full'].forEach(id => {
      const img = document.getElementById(id);
      if (img) { img.src = artSrc; img.alt = artAlt; }
    });

    const tone = TONE[state.q1] || TONE.cdi;
    document.getElementById('r-stat').textContent =
      both(tone.zh, tone.fr) + ' ' + both(REAL_STAT.zh, REAL_STAT.fr);

    // Q3 answer's resource leads the unlocked-resources list; the rest follow.
    // Teaser + blur: the category title stays sharp, only the specific payoff is blurred.
    const needsList = document.getElementById('r-needs-list');
    needsList.innerHTML = '';
    const orderedIds = [state.q3, ...Object.keys(NEEDS).filter(id => id !== state.q3)];
    orderedIds.forEach(id => {
      const need = NEEDS[id];
      const card = document.createElement('div');
      card.className = 'lock-card' + (id === state.q3 ? ' primary' : '');
      card.innerHTML = `
        <i class="fas fa-lock lock-icon"></i>
        <div class="lock-card-title">${both(need.zh, need.fr)}</div>
        <div class="lock-blur-preview">${both(need.teaser_zh, need.teaser_fr)}</div>`;
      needsList.appendChild(card);
    });

    // wa.me share — archetype name (both languages) + link back to the game.
    const shareText = `我是「${archetype.zh}」· Je suis "${archetype.fr}" ! 來測你的台法職涯原型 · Découvre ton archétype → https://ttf-tech.github.io/game.html`;
    document.getElementById('share-btn').href = 'https://wa.me/?text=' + encodeURIComponent(shareText);

    // Peak-end capsule + multi-platform share dock.
    const anchorEl = document.getElementById('anchor-capsule-text');
    if (anchorEl && archetype.anchor_zh) anchorEl.textContent = both(archetype.anchor_zh, archetype.anchor_fr);
    const encodedShareText = encodeURIComponent(shareText);
    const gameUrl = encodeURIComponent('https://ttf-tech.github.io/game.html');
    const lineBtn = document.getElementById('share-line');
    const linkedinBtn = document.getElementById('share-linkedin');
    const whatsappBtn = document.getElementById('share-whatsapp');
    const facebookBtn = document.getElementById('share-facebook');
    if (lineBtn) lineBtn.href = `https://social-plugins.line.me/lineit/share?url=${gameUrl}&text=${encodedShareText}`;
    if (linkedinBtn) linkedinBtn.href = `https://www.linkedin.com/sharing/share-offsite/?url=${gameUrl}`;
    if (whatsappBtn) whatsappBtn.href = `https://wa.me/?text=${encodedShareText}`;
    if (facebookBtn) facebookBtn.href = `https://www.facebook.com/sharer/sharer.php?u=${gameUrl}`;

    document.getElementById('unlock-btn').href = 'adhesion.html?type=' + encodeURIComponent(state.q2);
    updateUnlockButtonVisibility();
  }

  // ── Advanced test gate (Adhésion members only) ───────────────────
  function updateUnlockButtonVisibility() {
    const btn = document.getElementById('unlock-btn');
    if (btn) btn.style.display = hasAssoAccess ? 'none' : 'flex';
  }

  function updateAdvancedGate(hasAccess, isRestoring, user) {
    const signinBtn = document.querySelector('.adv-signin-btn');
    const joinBtn   = document.querySelector('.adv-join-btn');
    const startBtn  = document.querySelector('.adv-start-btn');
    const artLocked = document.getElementById('archetype-art-locked');
    const artFull   = document.getElementById('archetype-art-img-full');
    if (!signinBtn || !joinBtn || !startBtn) return;
    if (isRestoring) {
      signinBtn.style.display = joinBtn.style.display = startBtn.style.display = 'none';
      return;
    }
    signinBtn.style.display = !user ? 'flex' : 'none';
    joinBtn.style.display   = (user && !hasAccess) ? 'flex' : 'none';
    startBtn.style.display  = hasAccess ? 'flex' : 'none';
    // Member-exclusive archetype art: blurred sneak-peek until membership confirmed.
    if (artLocked && artFull) {
      artLocked.style.display = hasAccess ? 'none' : 'block';
      artFull.style.display   = hasAccess ? 'block' : 'none';
    }
  }

  document.addEventListener('ttf:member-gate-change', event => {
    const { hasAccess, isRestoring, user } = event.detail || {};
    hasAssoAccess = !!hasAccess;
    updateAdvancedGate(hasAssoAccess, !!isRestoring, user);
    updateUnlockButtonVisibility();
  });

  function renderAdvancedFlow() {
    const wrap = document.getElementById('advanced-questions');
    if (!wrap) return;
    wrap.innerHTML = '';

    const answeredCount = state.advancedInsights.length;
    if (answeredCount < ADVANCED_QUESTIONS.length) {
      const q = ADVANCED_QUESTIONS[answeredCount];
      const title = document.createElement('div');
      title.className = 'lock-card-title';
      title.style.marginBottom = '0.5rem';
      title.textContent = both(q.title_zh, q.title_fr);
      wrap.appendChild(title);
      q.options.forEach(opt => {
        wrap.appendChild(optionButton(opt, () => {
          state.advancedInsights.push({ qIndex: answeredCount, action_zh: opt.insight_zh, action_fr: opt.insight_fr });
          renderAdvancedFlow();
        }));
      });
      return;
    }

    // Strategic Diagnostic Report: a personalized validation paragraph, then
    // insights grouped by theme as Dynamic → Analysis → Action — not a flat checklist.
    const archetype = ARCHETYPES[state.q2] || ARCHETYPES.ancreur;

    const header = document.createElement('div');
    header.className = 'lock-card primary';
    header.innerHTML = `<div class="lock-card-title">${both('你的進階洞察', 'Ton insight avancé')}</div>`;
    wrap.appendChild(header);

    if (archetype.validation_zh) {
      const validation = document.createElement('div');
      validation.className = 'diag-validation';
      validation.innerHTML = `<i class="fas fa-compass"></i>${both(archetype.validation_zh, archetype.validation_fr)}`;
      wrap.appendChild(validation);
    }

    Object.keys(ADVANCED_THEMES).forEach(themeKey => {
      const items = state.advancedInsights.filter(ins => ADVANCED_QUESTIONS[ins.qIndex].theme === themeKey);
      if (!items.length) return;
      const theme = ADVANCED_THEMES[themeKey];
      const itemsHtml = items.map(ins => {
        const q = ADVANCED_QUESTIONS[ins.qIndex];
        return `
          <div class="diag-item">
            <div class="diag-dynamic"><i class="fas ${q.topic_icon}"></i><span>${both(q.dynamic_zh, q.dynamic_fr)}</span></div>
            <div class="diag-analysis">${both(q.analysis_zh, q.analysis_fr)}</div>
            <div class="diag-action"><i class="fas fa-arrow-right"></i><span>${both(ins.action_zh, ins.action_fr)}</span></div>
          </div>`;
      }).join('');
      const section = document.createElement('div');
      section.className = 'diag-theme';
      section.innerHTML = `
        <div class="diag-theme-title"><i class="fas ${theme.icon}"></i>${both(theme.title_zh, theme.title_fr)}</div>
        ${itemsHtml}`;
      wrap.appendChild(section);
    });
  }

  function resetAdvancedFlow() {
    state.advancedInsights = [];
    advancedStarted = false;
    const wrap = document.getElementById('advanced-questions');
    if (wrap) { wrap.style.display = 'none'; wrap.innerHTML = ''; }
    const actions = document.getElementById('advanced-gate-actions');
    if (actions) actions.style.display = 'flex';
  }

  document.querySelector('.adv-start-btn')?.addEventListener('click', () => {
    advancedStarted = true;
    state.advancedInsights = [];
    document.getElementById('advanced-gate-actions').style.display = 'none';
    document.getElementById('advanced-questions').style.display = 'block';
    renderAdvancedFlow();
  });

  document.querySelectorAll('[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => setLang(btn.dataset.lang));
  });
  document.getElementById('back-btn').addEventListener('click', goBack);
  document.getElementById('start-btn').addEventListener('click', () => showStep(STEPS.indexOf('q1')));
  document.getElementById('replay-btn').addEventListener('click', () => {
    state.q1 = state.q2 = state.q3 = null;
    resetAdvancedFlow();
    showStep(STEPS.indexOf('splash'));
  });

  setLang(detectLang());
  showStep(0);
  </script>
</body>
</html>
