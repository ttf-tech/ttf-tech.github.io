  <style>

    body { background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 55%, #0f172a 100%); min-height: 100vh; }
    .game-wrap { max-width: 480px; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; min-height: 100vh; display: flex; flex-direction: column; }

    .g-view { display: none; flex: 1; flex-direction: column; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .g-title { color: #fff; font-size: 1.5rem; font-weight: 900; line-height: 1.3; margin-bottom: 0.5rem; }

      display: block; width: 100%; text-align: left; background: rgba(255,255,255,0.06);

<body>

  <div class="game-wrap">
    <div class="g-header">
      <a class="g-logo" href="index.html">
        <img src="favicon-32x32.png" alt="TTF">
        <span>Taiwan Tech France</span>
      </a>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button>

    <div class="g-nav">
      <button type="button" class="g-back" id="back-btn" style="visibility:hidden;"><i class="fas fa-arrow-left"></i></button>

    <!-- Splash -->
    <div class="g-view active" id="view-splash">
      <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
        <div style="font-size:3rem; margin-bottom:1rem;">🧭</div>
        <div class="g-title" data-zh="你的台法職涯原型是？" data-fr="Quel est ton archétype carrière France-Taïwan ?">你的台法職涯原型是？</div>
        <div class="g-sub" data-zh="3 個問題，1 分鐘，找出最適合你的方向與資源。" data-fr="3 questions, 1 minute, pour trouver la direction et les ressources qui te correspondent.">3 個問題，1 分鐘，找出最適合你的方向與資源。</div>
      </div>
      <button type="button" class="g-cta" id="start-btn">
        <span data-zh="開始測驗" data-fr="Commencer">開始測驗</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>

    <!-- Q1 : status -->
    <div class="g-view" id="view-q1">
      <div class="g-title" data-zh="你目前的狀態是？" data-fr="Quel est ton statut actuel ?">你目前的狀態是？</div>
      <div class="g-sub" data-zh="幫我們更了解你" data-fr="Pour mieux te connaître">幫我們更了解你</div>

    <!-- Q2 : trajectory -->
    <div class="g-view" id="view-q2">
      <div class="g-title" data-zh="台法兩地的長期規劃？" data-fr="Ta trajectoire long terme, France-Taïwan ?">台法兩地的長期規劃？</div>
      <div class="g-sub" data-zh="這決定你的原型" data-fr="Ceci détermine ton archétype">這決定你的原型</div>
      <div id="q2-options"></div>
    </div>

    <!-- Q3 : immediate need -->
    <div class="g-view" id="view-q3">
      <div class="g-title" data-zh="現在最需要的資源？" data-fr="De quoi as-tu besoin en ce moment ?">現在最需要的資源？</div>
      <div class="g-sub" data-zh="最後一題！" data-fr="Dernière question !">最後一題！</div>
      <div id="q3-options"></div>
    </div>

    <!-- Result -->
    <div class="g-view" id="view-result">
      <div class="archetype-card">
        <div class="archetype-emoji" id="r-emoji">🧭</div>
        <div class="archetype-name-zh" id="r-name-zh">扎根者</div>
        <div class="archetype-name-fr" id="r-name-fr">L'Ancreur</div>
        <div class="archetype-tagline" id="r-tagline"></div>
      </div>

      <div class="stat-line" id="r-stat"></div>

      <div class="share-row">
        <a class="g-cta" id="share-btn" target="_blank" rel="noopener">
          <i class="fab fa-whatsapp"></i>
          <span data-zh="分享給朋友" data-fr="Partager">分享給朋友</span>
        </a>
      </div>

      <div class="unlock-section">
        <div class="unlock-label"><i class="fas fa-lock"></i><span data-zh="專屬解鎖內容" data-fr="Contenu à débloquer">專屬解鎖內容</span></div>

        <div class="lock-card primary">
          <i class="fas fa-lock lock-icon"></i>
          <div class="lock-blur">
            <div class="lock-card-title" id="r-hook-zh">你的專屬行動指南</div>
            <div class="lock-card-title-fr" id="r-hook-fr"></div>
          </div>
        </div>

        <div id="r-needs-list"></div>

        <div class="lock-card" style="margin-top:0.9rem;background:rgba(255,255,255,0.03);">
          <div class="lock-card-title" style="color:rgba(255,255,255,0.75);" data-zh="下一場閉門場次，會員優先保留名額" data-fr="Prochaine session à huis clos, places prioritaires pour les membres">下一場閉門場次，會員優先保留名額</div>
          <div class="lock-card-title-fr" id="r-session-date"></div>
        </div>
      </div>

      <a class="g-cta" id="unlock-btn" style="margin-top:1rem;">
        <i class="fas fa-unlock"></i>
        <span data-zh="成為會員，解鎖完整內容" data-fr="Devenir membre, tout débloquer">成為會員，解鎖完整內容</span>
      </a>
      <button type="button" class="g-cta-secondary" id="replay-btn" style="margin-top:0.6rem;">
        <span data-zh="重新測驗" data-fr="Refaire le test">重新測驗</span>
      </button>

      <div class="g-footer-link">
        <span data-zh="想看更多資源？" data-fr="Envie de voir plus de ressources ?">想看更多資源？</span>
        <a href="resources.html" data-zh="回到資源頁" data-fr="Retour aux ressources">回到資源頁</a>
      </div>
    </div>
  </div>

  <script>
  'use strict';

  // ── Session date: edit this one line once the closed-door session is confirmed ──
  const SESSION_DATE = { zh: '日期即將公布', fr: 'Date à confirmer' };

  // Real, verified community stat (WhatsApp survey, 125 responses) — see vote.html "你目前的狀態是？"
  const REAL_STAT = { zh: '你並不孤單：在 125 位受訪社群成員中，45% 也正在積極求職中（來自社群調查）。',
                       fr: 'Tu n\'es pas seul(e) : sur 125 membres sondés, 45% sont aussi activement en recherche (sondage communautaire).' };

  const ARCHETYPES = {
    ancreur: {
      emoji: '🌳', zh: '扎根者', fr: "L'Ancreur",
      tagline_zh: '你已經決定：法國是你長期的家。', tagline_fr: 'Tu as décidé : la France, c\'est chez toi, pour longtemps.',
      hook_zh: '入籍時間軸規劃、CDI／CIR 身份槓桿運用', hook_fr: 'Calendrier de naturalisation, effet de levier CDI/CIR'
    },
    pont: {
      emoji: '🌉', zh: '橋樑者', fr: 'Le Pont',
      tagline_zh: '你想成為連結台灣與歐洲的那座橋。', tagline_fr: 'Tu veux être le pont entre Taïwan et l\'Europe.',
      hook_zh: '駐法台北辦事處與僑務委員會（OCAC）註冊資源', hook_fr: 'Bureau français de Taipei + inscription OCAC'
    },
    tremplin: {
      emoji: '🚀', zh: '跳板者', fr: 'Le Tremplin',
      tagline_zh: '法國只是起點，你的目光望向整個歐洲。', tagline_fr: 'La France n\'est qu\'un début, tu vises toute l\'Europe.',
      hook_zh: '跨境內推地圖，串連歐洲各國的機會', hook_fr: 'Carte de cooptation transfrontalière en Europe'
    },
    boomerang: {
      emoji: '🪃', zh: '回流者', fr: 'Le Boomerang',
      tagline_zh: '你想帶著法國經驗，最終回到台灣。', tagline_fr: 'Tu veux ramener ton expérience française à Taïwan.',
      hook_zh: '退休金與社會保險的可攜性規劃', hook_fr: 'Portabilité de la pension et de la sécurité sociale'
    },
    biresident: {
      emoji: '🦎', zh: '雙棲者', fr: 'Le Bi-Résident',
      tagline_zh: '你想在台法兩地之間自由往返，兼顧生活與事業。', tagline_fr: 'Tu veux naviguer librement entre la France et Taïwan.',
      hook_zh: '稅務與投資工作坊（社群票選 15 票最高需求）', hook_fr: 'Atelier fiscalité & investissement (top demande, 15 votes)'
    }
  };

  const Q1_OPTIONS = [
    { id: 'cdi', zh: 'CDI（正職）', fr: 'CDI' },
    { id: 'freelance', zh: 'Freelance（自由工作者）', fr: 'Freelance' },
    { id: 'recherche', zh: '求職中', fr: 'En recherche' },
    { id: 'nouveau', zh: '剛抵達法國', fr: 'Nouvel(le) arrivant(e)' }
  ];

  const Q2_OPTIONS = [
    { id: 'ancreur',    zh: '長期定居法國（入籍或永久居留）', fr: 'S\'installer durablement en France' },
    { id: 'pont',       zh: '成為台歐之間的科技與商業橋樑',   fr: 'Devenir un pont tech/business Taïwan-Europe' },
    { id: 'tremplin',   zh: '以法國為跳板，放眼歐洲市場',     fr: 'Utiliser la France comme tremplin vers l\'Europe' },
    { id: 'boomerang',  zh: '累積法國經驗後最終返回台灣',     fr: 'Retourner à Taïwan avec une expérience française' },
    { id: 'biresident', zh: '台法雙邊資產配置，自由往返',     fr: 'Patrimoine France-Taïwan, allers-retours' }
  ];

  const NEEDS = {
    cv:         { zh: '履歷優化與一對一職涯諮詢', fr: 'Coaching de carrière / relecture de CV' },
    tax:        { zh: '稅務與法規交流工作坊',     fr: 'Atelier fiscalité & réglementation' },
    referral:   { zh: '企業內推網絡',             fr: 'Réseau de cooptation en entreprise' },
    experience: { zh: '會員實戰經驗分享',         fr: 'Partage d\'expérience terrain entre membres' }
  };
  const Q3_OPTIONS = [
    { id: 'cv', ...NEEDS.cv },
    { id: 'tax', ...NEEDS.tax },
    { id: 'referral', ...NEEDS.referral },
    { id: 'experience', ...NEEDS.experience }
  ];

  // Tone modulation by Q1 answer — "en recherche" leads with referrals, per spec.
  const TONE = {
    cdi:       { zh: '穩定的起點，是時候放眼下一步了。', fr: 'Un point de départ stable — il est temps de viser plus loin.' },
    freelance: { zh: '自由工作者的彈性，正是連結資源的好時機。', fr: 'La flexibilité du freelance, le bon moment pour se connecter aux bonnes ressources.' },
    recherche: { zh: '求職中？現在正是善用社群內推網絡的時刻。', fr: 'En recherche ? C\'est le moment d\'activer le réseau de cooptation de la communauté.' },
    nouveau:   { zh: '剛抵達法國？從這些資源開始，少走彎路。', fr: 'Nouvel(le) arrivant(e) ? Commence par ces ressources pour gagner du temps.' }
  };

  // ── State ──────────────────────────────────────────────────────
  const STEPS = ['splash', 'q1', 'q2', 'q3', 'result'];
  let state = { step: 0, lang: 'zh', q1: null, q2: null, q3: null };

  function detectLang() {
    try {
      const saved = localStorage.getItem('ttf_game_lang');
      if (saved === 'zh' || saved === 'fr') return saved;
    } catch (_) {}
    const nav = (navigator.language || '').toLowerCase();
    return nav.startsWith('fr') ? 'fr' : 'zh';
  }

  function setLang(lang) {
    state.lang = lang;
    try { localStorage.setItem('ttf_game_lang', lang); } catch (_) {}
    document.querySelectorAll('[data-lang]').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
    document.querySelectorAll('[data-zh]').forEach(el => {
      el.textContent = lang === 'fr' ? `${el.dataset.fr} · ${el.dataset.zh}` : `${el.dataset.zh} · ${el.dataset.fr}`;
    });
    renderOptions();
    if (STEPS[state.step] === 'result') renderResult();
  }

  function showStep(index) {
    state.step = index;
    const name = STEPS[index];
    document.querySelectorAll('.g-view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');

    const backBtn = document.getElementById('back-btn');
    backBtn.style.visibility = (name === 'splash' || name === 'result') ? 'hidden' : 'visible';

    const dots = document.getElementById('dots');
    const questionSteps = ['q1', 'q2', 'q3'];
    if (questionSteps.includes(name)) {
      dots.style.display = 'flex';
      const qIndex = questionSteps.indexOf(name);
      document.querySelectorAll('.g-dot').forEach((dot, i) => {
        dot.classList.toggle('done', i < qIndex);
        dot.classList.toggle('current', i === qIndex);
      });
    } else {
      dots.style.display = 'none';
    }
  }

  function goBack() {
    const name = STEPS[state.step];
    if (name === 'q1') showStep(STEPS.indexOf('splash'));
    else if (name === 'q2') showStep(STEPS.indexOf('q1'));
    else if (name === 'q3') showStep(STEPS.indexOf('q2'));
  }

  function optionButton(opt, onPick) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'g-opt';
    btn.innerHTML = `<span class="g-opt-zh">${state.lang === 'fr' ? opt.fr : opt.zh}</span>` +
                    (opt.zh && opt.fr ? `<span class="g-opt-fr">${state.lang === 'fr' ? opt.zh : opt.fr}</span>` : '');
    btn.addEventListener('click', onPick);
    return btn;
  }

  function renderOptions() {
    const q1Wrap = document.getElementById('q1-options');
    q1Wrap.innerHTML = '';
    Q1_OPTIONS.forEach(opt => {
      q1Wrap.appendChild(optionButton(opt, () => {
        state.q1 = opt.id;
        showStep(STEPS.indexOf('q2'));
      }));
    });

    const q2Wrap = document.getElementById('q2-options');
    q2Wrap.innerHTML = '';
    Q2_OPTIONS.forEach(opt => {
      q2Wrap.appendChild(optionButton(opt, () => {
        state.q2 = opt.id;
        showStep(STEPS.indexOf('q3'));
      }));
    });

    const q3Wrap = document.getElementById('q3-options');
    q3Wrap.innerHTML = '';
    Q3_OPTIONS.forEach(opt => {
      q3Wrap.appendChild(optionButton(opt, () => {
        state.q3 = opt.id;
        renderResult();
        showStep(STEPS.indexOf('result'));
      }));
    });
  }

  // Always renders both languages together — order only follows the toggle.
  function both(zh, fr) {
    return state.lang === 'fr' ? `${fr} · ${zh}` : `${zh} · ${fr}`;
  }

  function renderResult() {
    const archetype = ARCHETYPES[state.q2] || ARCHETYPES.ancreur;
    const lang = state.lang;

    document.getElementById('r-emoji').textContent = archetype.emoji;
    document.getElementById('r-name-zh').textContent = lang === 'fr' ? archetype.fr : archetype.zh;
    document.getElementById('r-name-fr').textContent = lang === 'fr' ? archetype.zh : archetype.fr;
    document.getElementById('r-tagline').textContent = both(archetype.tagline_zh, archetype.tagline_fr);
    document.getElementById('r-hook-zh').textContent = both(archetype.hook_zh, archetype.hook_fr);
    document.getElementById('r-hook-fr').textContent = '';
    document.getElementById('r-session-date').textContent = both(SESSION_DATE.zh, SESSION_DATE.fr);

    const tone = TONE[state.q1] || TONE.cdi;
    document.getElementById('r-stat').textContent =
      both(tone.zh, tone.fr) + ' ' + both(REAL_STAT.zh, REAL_STAT.fr);

    // Q3 answer's resource leads the unlocked-resources list; the rest follow.
    const needsList = document.getElementById('r-needs-list');
    needsList.innerHTML = '';
    const orderedIds = [state.q3, ...Object.keys(NEEDS).filter(id => id !== state.q3)];
    orderedIds.forEach(id => {
      const need = NEEDS[id];
      const card = document.createElement('div');
      card.className = 'lock-card' + (id === state.q3 ? ' primary' : '');
      card.innerHTML = `
        <i class="fas fa-lock lock-icon"></i>
        <div class="lock-blur">
          <div class="lock-card-title">${both(need.zh, need.fr)}</div>
        </div>`;
      needsList.appendChild(card);
    });

    // wa.me share — archetype name (both languages) + link back to the game.
    const shareText = `我是「${archetype.zh}」· Je suis "${archetype.fr}" ! 來測你的台法職涯原型 · Découvre ton archétype → https://ttf-tech.github.io/game.html`;
    document.getElementById('share-btn').href = 'https://wa.me/?text=' + encodeURIComponent(shareText);

    document.getElementById('unlock-btn').href = 'adhesion.html?type=' + encodeURIComponent(state.q2);
  }

  document.querySelectorAll('[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => setLang(btn.dataset.lang));
  });
  document.getElementById('back-btn').addEventListener('click', goBack);
  document.getElementById('start-btn').addEventListener('click', () => showStep(STEPS.indexOf('q1')));
  document.getElementById('replay-btn').addEventListener('click', () => {
    state.q1 = state.q2 = state.q3 = null;
    showStep(STEPS.indexOf('splash'));
  });

  setLang(detectLang());
  showStep(0);
  </script>
</body>
</html>
